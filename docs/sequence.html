<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raft sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="40" y="20" width="110" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="95" y="41" text-anchor="middle" fill="#1d4ed8">A (cand)</text>
    <rect x="230" y="20" width="110" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="285" y="41" text-anchor="middle" fill="#15803d">B</text>
    <rect x="420" y="20" width="110" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="475" y="41" text-anchor="middle" fill="#15803d">C</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="95" y1="52" x2="95" y2="430"/>
    <line x1="285" y1="52" x2="285" y2="430"/>
    <line x1="475" y1="52" x2="475" y2="430"/>
  </g>

  <text x="40" y="80" font-size="12" font-weight="700" fill="#0f172a">A. Election</text>
  <line x1="95" y1="100" x2="280" y2="100" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="187" y="94" text-anchor="middle" font-size="11" fill="#1e40af">vote request (term 1)</text>
  <line x1="95" y1="125" x2="470" y2="125" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="282" y="119" text-anchor="middle" font-size="11" fill="#1e40af">vote request (term 1)</text>
  <line x1="285" y1="150" x2="100" y2="150" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrG)"/>
  <line x1="475" y1="150" x2="100" y2="150" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrG)"/>
  <text x="190" y="164" text-anchor="middle" font-size="11" fill="#15803d">votes granted → A becomes leader</text>

  <text x="40" y="200" font-size="12" font-weight="700" fill="#0f172a">B. Replicate & commit</text>
  <line x1="95" y1="220" x2="280" y2="220" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="187" y="214" text-anchor="middle" font-size="11" fill="#1e40af">appendEntries{x=1}</text>
  <line x1="95" y1="245" x2="470" y2="245" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="282" y="239" text-anchor="middle" font-size="11" fill="#1e40af">appendEntries{x=1}</text>
  <line x1="285" y1="270" x2="100" y2="270" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrG)"/>
  <line x1="475" y1="270" x2="100" y2="270" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrG)"/>
  <text x="190" y="284" text-anchor="middle" font-size="11" fill="#15803d">2/3 ack → x=1 committed</text>

  <text x="40" y="320" font-size="12" font-weight="700" fill="#0f172a">C. Leader crash → new election (term 2)</text>
  <line x1="95" y1="345" x2="95" y2="365" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="95" y="380" text-anchor="middle" font-size="11" fill="#b91c1c">A down</text>
  <line x1="285" y1="400" x2="470" y2="400" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="377" y="394" text-anchor="middle" font-size="11" fill="#1e40af">B campaigns term 2 → wins → new leader</text>
</svg>
</body>
</html>
