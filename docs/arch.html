<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raft architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- leader -->
  <rect x="380" y="40" width="240" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="500" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Leader (term 2)</text>
  <text x="500" y="90" text-anchor="middle" font-size="11.5" fill="#475569">log: [x=1, y=2, z=3]</text>
  <text x="500" y="108" text-anchor="middle" font-size="11" fill="#64748b">accepts writes, replicates log</text>

  <!-- followers -->
  <g font-size="12">
    <rect x="80" y="250" width="220" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="190" y="278" text-anchor="middle" font-weight="700" fill="#15803d">Follower B</text>
    <text x="190" y="298" text-anchor="middle" font-size="11" fill="#166534">log: [x=1, y=2, z=3]</text>
    <text x="190" y="316" text-anchor="middle" font-size="10.5" fill="#64748b">ack = yes</text>

    <rect x="390" y="250" width="220" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="500" y="278" text-anchor="middle" font-weight="700" fill="#15803d">Follower C</text>
    <text x="500" y="298" text-anchor="middle" font-size="11" fill="#166534">log: [x=1, y=2, z=3]</text>
    <text x="500" y="316" text-anchor="middle" font-size="10.5" fill="#64748b">ack = yes</text>

    <rect x="700" y="250" width="220" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="810" y="278" text-anchor="middle" font-weight="700" fill="#b91c1c">Node A (down)</text>
    <text x="810" y="298" text-anchor="middle" font-size="11" fill="#b91c1c">crashed → recovered later</text>
    <text x="810" y="316" text-anchor="middle" font-size="10.5" fill="#64748b">reconciles on return</text>
  </g>

  <!-- replication arrows -->
  <line x1="440" y1="130" x2="210" y2="250" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="500" y1="130" x2="500" y2="250" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="560" y1="130" x2="790" y2="250" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="500" y="180" text-anchor="middle" font-size="11.5" fill="#475569">replicate log entries + heartbeat</text>

  <!-- properties -->
  <rect x="80" y="360" width="840" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="385" font-size="11.5" fill="#334155">majority (2/3) ack → entry committed · new election on leader crash · term prevents split-brain</text>
  <text x="100" y="405" font-size="11" fill="#64748b">simplified in-memory model for learning; real Raft adds pre-vote, log matching, snapshots, timed RPCs.</text>
</svg>
</body>
</html>
